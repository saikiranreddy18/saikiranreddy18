<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="46" viewBox="0 0 1200 46" fill="none" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="dr" x1="600" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E879F9"/>
      <stop offset="1" stop-color="#E879F9" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <line x1="60"  y1="23" x2="560" y2="23" stroke="url(#dl)" stroke-width="1.5"/>
  <line x1="640" y1="23" x2="1140" y2="23" stroke="url(#dr)" stroke-width="1.5"/>
  <g transform="translate(600,23)">
    <g filter="url(#dg)">
      <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#818CF8" transform="rotate(45)"/>
    </g>
    <rect x="-7" y="-7" width="14" height="14" rx="2.5" fill="#0A0E1A" stroke="#818CF8" stroke-width="1.5" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="3" fill="#22D3EE">
      <animate attributeName="fill" values="#22D3EE;#E879F9;#22D3EE" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;3.5;2.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="520" cy="23" r="2" fill="#38BDF8"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="680" cy="23" r="2" fill="#E879F9"><animate attributeName="fill-opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
</svg>
